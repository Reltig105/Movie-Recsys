# Production reverse proxy for Rexter.
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf.

upstream rexter_backend {
    server backend:8000;
}

upstream rexter_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name rexter.ru www.rexter.ru;

    server_tokens off;
    client_max_body_size 10m;

    # These headers are inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # FastAPI endpoints. The URI is preserved because proxy_pass has no path.
    location ~ ^/(api|login|register|logout|rate|recommend|user|search|health|docs|redoc)(/|$) {
        proxy_pass http://rexter_backend;
    }

    location = /openapi.json {
        proxy_pass http://rexter_backend;
    }

    # React SPA and static assets.
    location / {
        proxy_pass http://rexter_frontend;
    }
}
