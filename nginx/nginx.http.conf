# Temporary HTTP-only config for the first Let's Encrypt certificate.
# It is NOT used by the production compose service after issuance.
#
#   docker run --rm -d --name rexter-acme \
#     -p 80:80 \
#     -v "$PWD/nginx/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro" \
#     -v "$PWD/certbot/www:/var/www/certbot:ro" \
#     nginx:alpine

server {
    listen 80;
    server_name rexter.ru www.rexter.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
