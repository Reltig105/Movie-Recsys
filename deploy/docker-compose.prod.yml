# Production-база Rexter: пароль из .env, порт только на localhost.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# uvicorn запускается на хосте (systemd, см. deploy/rexter.service) и подключается
# к базе через 127.0.0.1:5432. Наружу порт не публикуется.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rexter-postgres
    restart: unless-stopped
    # /dev/shm для параллельных сортировок/хешей при массовой загрузке и REFRESH.
    shm_size: "1gb"
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "maintenance_work_mem=256MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rexter_db}
      POSTGRES_USER: ${POSTGRES_USER:-rexter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rexter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rexter} -d ${POSTGRES_DB:-rexter_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rexter_pgdata:
    name: rexter_pgdata
