# Production stack for Rexter: Nginx -> frontend/backend -> PostgreSQL/Redis.
#
# Run from the repository root:
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
#
# Only Nginx publishes a host port (80). PostgreSQL, Redis, FastAPI and the
# frontend are reachable only through the internal Docker network.

name: rexter

services:
  postgres:
    image: postgres:16-alpine
    container_name: rexter-postgres
    restart: unless-stopped
    shm_size: "1gb"
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "maintenance_work_mem=256MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rexter_db}
      POSTGRES_USER: ${POSTGRES_USER:-rexter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - rexter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rexter} -d ${POSTGRES_DB:-rexter_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rexter_internal

  redis:
    image: redis:7-alpine
    container_name: rexter-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rexter_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rexter-backend
    restart: unless-stopped
    environment:
      REXTER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rexter}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rexter_db}
      REXTER_REDIS_URL: redis://redis:6379/0
      REXTER_COOLDOWN_TTL: ${REXTER_COOLDOWN_TTL:-86400}
      REXTER_ARTIFACTS_DIR: /app/data/artifacts
      REXTER_LOG_LEVEL: ${REXTER_LOG_LEVEL:-INFO}
      REXTER_ALLOWED_ORIGINS: ""
    volumes:
      - ../data/artifacts:/app/data/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - rexter_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rexter-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rexter_internal

  nginx:
    image: nginx:alpine
    container_name: rexter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - rexter_internal

volumes:
  rexter_pgdata:
    name: rexter_pgdata

networks:
  rexter_internal:
    name: rexter_internal
    driver: bridge
